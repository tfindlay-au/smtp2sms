services:
  smtp2sms:
    build: .
    container_name: smtp2sms
    restart: unless-stopped
    ports:
      - "25:25"
      - "8080:8080"
    environment:
      ALLOWED_SOURCE_IPS: "${ALLOWED_SOURCE_IPS}"
      RUT_HOST: "${RUT_HOST:-10.2.10.1}"
      RUT_MODEM: "${RUT_MODEM:-1-1.4}"
      RUT_SMS_USERNAME: "${RUT_SMS_USERNAME}"
      RUT_SMS_PASSWORD: "${RUT_SMS_PASSWORD}"
      RELAY_HOST: "${RELAY_HOST:-smtp.gmail.com}"
      RELAY_PORT: "${RELAY_PORT:-587}"
      RELAY_USER: "${RELAY_USER:-}"
      RELAY_PASSWORD: "${RELAY_PASSWORD:-}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
